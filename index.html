<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epic Horse</title>
<style>
  :root {
    --bg: #0b0b12;
    --card-a: #23232f;
    --card-b: #121219;
    --text: #f5f5f5;
    --muted: #a3a3b5;
    --accent-1: #ff6ec4;
    --accent-2: #7873f5;
    --accent-3: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 20% 20%, #7873f533, transparent 40%),
      radial-gradient(circle at 80% 80%, #ff6ec433, transparent 40%),
      var(--bg);
    font: 1rem system-ui, sans-serif;
    overflow: hidden;
  }
  main {
    position: relative;
    width: min(720px, calc(100% - 32px));
    min-height: 420px;
    padding: clamp(2.5rem, 8vw, 5rem) 1rem;
    text-align: center;
    color: var(--text);
    background: linear-gradient(145deg, var(--card-a), var(--card-b));
    border-radius: 24px;
    box-shadow: 0 24px 70px #000c, inset 0 1px 0 #ffffff14;
    overflow: hidden;
    isolation: isolate;
  }
  /* animated glowing border */
  main::before {
    content: "";
    position: absolute;
    inset: -2px;
    z-index: -2;
    border-radius: inherit;
    background: conic-gradient(from var(--angle, 0deg), var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    animation: spin 6s linear infinite;
  }
  main::after {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: -1;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--card-a), var(--card-b));
  }
  @property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --angle: 360deg; } }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.05;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 0 18px #7873f566);
  }
  @keyframes shimmer { to { background-position: 300% 0; } }

  .hint {
    margin-top: 1rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  kbd {
    display: inline-block;
    padding: 0.1em 0.45em;
    border: 1px solid #ffffff33;
    border-bottom-width: 3px;
    border-radius: 6px;
    font: inherit;
    font-size: 0.85em;
    color: var(--text);
    background: #ffffff0d;
  }

  #horse {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 56px;
    line-height: 1;
    user-select: none;
    will-change: transform;
    filter: drop-shadow(0 8px 10px #0009);
  }
  #horse span {
    display: inline-block;
    transition: transform 0.12s;
  }
  #horse.running span { animation: gallop 0.28s ease-in-out infinite; }
  @keyframes gallop {
    0%, 100% { translate: 0 0; rotate: 0deg; }
    50% { translate: 0 -8px; rotate: -6deg; }
  }

  .dust {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffffff55;
    pointer-events: none;
    animation: puff 0.6s ease-out forwards;
  }
  @keyframes puff {
    to { transform: scale(2.5); opacity: 0; }
  }
</style>
</head>
<body>
<main id="arena">
  <h1>This is so epic hello</h1>
  <p class="hint">Use <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> to ride the horse</p>
  <div id="horse" aria-label="Horse"><span>🐎</span></div>
</main>

<script>
  const arena = document.getElementById('arena');
  const horse = document.getElementById('horse');
  const sprite = horse.querySelector('span');
  const keys = new Set();
  const SPEED = 320; // px per second

  let x = 0, y = 0, facingRight = true, last = performance.now(), dustTimer = 0;

  function bounds() {
    return {
      w: arena.clientWidth - horse.offsetWidth,
      h: arena.clientHeight - horse.offsetHeight
    };
  }

  // start near bottom center
  function place() {
    const b = bounds();
    x = b.w / 2;
    y = b.h - 24;
  }
  place();

  addEventListener('keydown', e => {
    if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); }
  });
  addEventListener('keyup', e => keys.delete(e.key));
  addEventListener('blur', () => keys.clear());
  addEventListener('resize', () => {
    const b = bounds();
    x = Math.min(x, b.w); y = Math.min(y, b.h);
  });

  function spawnDust() {
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = (x + horse.offsetWidth / 2 + (facingRight ? -20 : 20)) + 'px';
    d.style.top = (y + horse.offsetHeight - 10) + 'px';
    arena.appendChild(d);
    d.addEventListener('animationend', () => d.remove());
  }

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    let dx = 0, dy = 0;
    if (keys.has('ArrowLeft')) dx -= 1;
    if (keys.has('ArrowRight')) dx += 1;
    if (keys.has('ArrowUp')) dy -= 1;
    if (keys.has('ArrowDown')) dy += 1;

    const moving = dx || dy;
    if (moving) {
      const len = Math.hypot(dx, dy);
      const b = bounds();
      x = Math.max(0, Math.min(b.w, x + (dx / len) * SPEED * dt));
      y = Math.max(0, Math.min(b.h, y + (dy / len) * SPEED * dt));
      if (dx) facingRight = dx > 0;

      dustTimer += dt;
      if (dustTimer > 0.08) { spawnDust(); dustTimer = 0; }
    }

    horse.classList.toggle('running', !!moving);
    // the emoji faces left by default, so flip it when heading right
    sprite.style.transform = facingRight ? 'scaleX(-1)' : 'scaleX(1)';
    horse.style.transform = `translate(${x}px, ${y}px)`;

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
